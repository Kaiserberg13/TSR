l_english:
 ALL_HAIL_THE_EMPIRE_DESC:0 "The world is left at the mercy of the gods. After a new great war, all nations are trying to recover from the losses and chaos it brought. Corporations are increasingly influencing countries, and Camellia is no exception. The most powerful corporation in the world, no, in the universe, has gone into autonomous mode. Economic and national characteristics cause more and more conflicts and wars. Everyone wants peace, maybe someone will come who can save us all?"
 

 ALL_HAIL_THE_EMPIRE_GER_DESC:0 "Germany emerged victorious from the Great War. The greatest share of that victory was owed to the German people. Under the command of General Frida, the German army achieved remarkable success. But after the war, armies were no longer needed — Europe began a wave of demobilization, and Frida herself was placed under arrest for an attempted coup. Yet society remains deeply divided, and tensions continue to rise. Will Germany unite Europe under the banner of democracy — or will it choose a different path?"
 ALL_HAIL_THE_EMPIRE_ENG_DESC:0 "Britain emerged as the loser among the victors. A humiliating defeat in the African theater shattered the nation’s morale. The country is falling apart — Scotland and Ireland are pushing harder for independence, seeking a fresh start. The people have turned against their own army and those who fought in the war: they are shunned, harassed, even beaten in the streets. But more and more often, both on the streets and across social media, people speak of a mysterious figure — a man who has declared himself the true king."
 ALL_HAIL_THE_EMPIRE_USA_DESC:0 "The United States did not survive the Great War intact. The nation was torn apart from within — by greedy corporations and a furious, disillusioned people. The horrors unfolding in the streets of its once-great cities defy description; they are beyond words, beyond even the worst nightmares. \nThe country needs a hero. But where can one be found?" 
 ALL_HAIL_THE_EMPIRE_SAF_DESC:0 "For years, South Africa has fought a brutal war against the former Menabe Empire. But now, Menabe is collapsing before our eyes — our old nemesis and historic enemy is struggling to hold on to the last remnants of its territory. While they cling to the ruins of the past, we have a chance to shape the future. There is no more time to wait — it is time to take matters into our own hands and unite the African peoples under a single banner of prosperity."
 ALL_HAIL_THE_EMPIRE_OAS_DESC:0 "The Hypocrestrial Union is going through difficult times. After its defeat in the Great War, the fury of a shattered world turned against its members. The Hypocrestrial Union is now burdened with sanctions, debts, and heavy reparations. Japan has been demilitarized, while China and the Oasisse are forced to hand over much of their production to former enemies. The Union is more oppressed than ever — yet more united than it has ever been. Its people stand shoulder to shoulder, not for their governments, but for one another."
 ALL_HAIL_THE_EMPIRE_SOV_DESC:0 "Russia, once a vast and multicultural country, now stands divided. While the ruling elite indulges in luxury, flowers, and wine, ordinary citizens suffer in poverty and despair. This disparity has sparked a wave of unrest across the nation. Though the country may appear united on the surface, in reality, entire regions have fallen under the control of communists, nationalists, anarchists, and other factions now outlawed by the state. Russia is cracking at its foundations — and no one knows who will seize control of its future."