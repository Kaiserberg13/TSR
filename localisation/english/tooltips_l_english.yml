 MENU_NEWS_FILM:0 "§Z[401-ST DAY OF THE BLOCAKDE]§!\n\nYes, we are indeed planning to make a film based on one of the darkest and most terrifying chapters of this mod and its entire story — the blockade of Pasifica. It will be a powerful and emotional work, portraying the horrors of war and the human lives trapped in the besieged city."
 MENU_NEWS_ASTOOLS:0 "§Z[AS TOOLS]§!\n\nWe’ve recently developed a powerful and user-friendly tool for content creators — introducing AS Tools. It’s a massive and multifunctional library of tools that simplifies many tasks and makes work faster and more convenient. AS Tools also offers a rich set of features for modding in Hearts of Iron IV."
 MENU_NEWS_NOVEL:0 "§Z[MERCHANTS OF DESTINY]§!\n\nAlongside the development of the mod, a novel titled “Merchants of destiny” is being written and published, set in the same universe. It explores another side of the war — a world of the wealthy, detached from the front lines, whose lives seem untouched by conflict but are no less tragic."
 MENU_NEWS_NEWS:0 "§Z[WELCOME TO THE TSR!]§!\n\nWelcome to the TSR mod beta! There’s still not much content yet — but plenty of bugs and issues to go around. If you notice anything unusual, please let us know on our Discord server! \n\n §Z[UNIVERSE]§!\n\nThis universe is fictional. While it draws inspiration from real-world events, it is a completely original franchise and is not intended to offend or target anyone in any way."